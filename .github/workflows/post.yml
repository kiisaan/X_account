name: チケ発募集ツイート

on:
  schedule:
    # JST 8:07 / 12:37 / 17:07（UTC で指定）
    - cron: "7 23 * * *"
    - cron: "37 3 * * *"
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずに文面だけ確認する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: post-tweet

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 投稿
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m bot.post ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: out/card.png
      - name: 投稿履歴を保存（重複文面の回避に使用）
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "投稿履歴を更新" && git push)
